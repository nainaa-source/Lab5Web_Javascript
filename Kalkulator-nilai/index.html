<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Nilai Mahasiswa</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 600px; background: white; padding: 25px; margin: auto; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2, h3 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0056b3; }
        .result-box { margin-top: 25px; padding: 15px; border-radius: 5px; background: #eef6ff; border-left: 5px solid #007bff; display: none; }
        .result-item { font-size: 16px; margin: 8px 0; }
        .status-lulus { color: #28a745; font-weight: bold; }
        .status-gagal { color: #dc3545; font-weight: bold; }
        .error-message { color: #dc3545; font-size: 14px; margin-top: 5px; display: none; }
        .scenario-section { margin-top: 30px; border-top: 2px dashed #ccc; padding-top: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    <h2>Kalkulator Nilai Mahasiswa</h2>
    
    <form id="calculatorForm">
        <div class="form-group">
            <label for="tugas">Nilai Tugas (30%):</label>
            <input type="number" id="tugas" min="0" max="100" step="0.01" placeholder="0 - 100" required>
        </div>

        <div class="form-group">
            <label for="uts">Nilai UTS (30%):</label>
            <input type="number" id="uts" min="0" max="100" step="0.01" placeholder="0 - 100" required>
        </div>

        <div class="form-group">
            <label for="uas">Nilai UAS (40%):</label>
            <input type="number" id="uas" min="0" max="100" step="0.01" placeholder="0 - 100" required>
        </div>

        <div id="errorMessage" class="error-message">Setiap nilai harus berada pada rentang 0 hingga 100!</div>

        <button type="button" onclick="prosesHitung()">Hitung Nilai</button>
    </form>

    <!-- Output Hasil -->
    <div id="resultBox" class="result-box">
        <h3>Hasil Perhitungan</h3>
        <div class="result-item">Nilai Akhir: <strong id="outNilaiAkhir">-</strong></div>
        <div class="result-item">Predikat: <strong id="outPredikat">-</strong></div>
        <div class="result-item">Status: <span id="outStatus">-</span></div>
    </div>

    <!-- Skenario Pengujian -->
    <div class="scenario-section">
        <h3>Uji Coba Skenario Nilai</h3>
        <table>
            <thead>
                <tr>
                    <th>Skenario</th>
                    <th>Tugas</th>
                    <th>UTS</th>
                    <th>UAS</th>
                    <th>Akhir</th>
                    <th>Predikat</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="scenarioTable">
                <!-- Diisi otomatis oleh JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
